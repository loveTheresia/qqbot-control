<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>孤独的鱼</title>
  <link rel="icon" href="/avatar.jpg">
  <link rel="stylesheet" href="/workbench.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="mark"><img src="/avatar.jpg" alt="孤独的鱼"></div>
      <div>
        <h1>孤独的鱼</h1>
        <p>规则、知识、数据、评测、发布，一处管理。</p>
      </div>
    </div>
    <div class="release" id="release-badge">读取版本…</div>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="on">概览</button>
    <button data-tab="rules">规则</button>
    <button data-tab="canon">Canon</button>
    <button data-tab="pipeline">数据管线</button>
    <button data-tab="changes">变更</button>
    <button data-tab="release">发布</button>
    <button data-tab="github">GitHub</button>
    <button data-tab="params">参数</button>
    <button data-tab="schedule">作息</button>
    <button data-tab="persona">人格卡</button>
    <a href="/eval" class="eval-link">进入评测 ↗</a>
  </nav>

  <main id="app">
    <section id="tab-dashboard" class="tab on"></section>
    <section id="tab-rules" class="tab"></section>
    <section id="tab-canon" class="tab"></section>
    <section id="tab-pipeline" class="tab"></section>
    <section id="tab-changes" class="tab"></section>
    <section id="tab-release" class="tab"></section>
    <section id="tab-github" class="tab"></section>
    <section id="tab-params" class="tab"></section>
    <section id="tab-schedule" class="tab"></section>
    <section id="tab-persona" class="tab"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/workbench.js"></script>
</body>
</html>
